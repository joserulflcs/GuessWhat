<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Valentine Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="welcome">
    <h1>Welcome to the Valentine's Game!</h1>
    <button onclick="startGame()">Start Game</button>
  </div>

  <div id="game" style="display: none;">
    <h2>Round 1</h2>
    <p id="songQuestion"></p>
    <button onclick="selectSong('A')">Song A</button>
    <button onclick="selectSong('B')">Song B</button>
  </div>

  <div id="endGame" style="display: none;">
    <h2>Do you know what all the winning songs' first letters spell?</h2>
    <button onclick="checkAnswer()">Yes, I know!</button>
    <input type="text" id="answer" placeholder="Enter the word here">
  </div>

  <div id="content" class="hidden-content" style="display: none;">
    <h2>🎉 Surprise! 🎉</h2>
    <p>Now that you've unlocked the secret, will you be my Valentine? ❤️</p>
  </div>

  <script>
    let currentRound = 1;
    let answerLetters = []; // To store the letters from correct answers
    let correctAnswers = ['V', 'A', 'L', 'E', 'N', 'T', 'I', 'N', 'E']; // Letters of the word "Valentine"
    
    function startGame() {
      document.getElementById('welcome').style.display = 'none';
      document.getElementById('game').style.display = 'block';
      showRound(currentRound);
    }

    function showRound(round) {
      // You can customize your questions here
      let songA = "Song A"; // Replace with song names
      let songB = "Song B"; // Replace with song names
      
      // Update question for this round
      document.getElementById('songQuestion').innerText = `Which song has more streams? \n1) ${songA} or 2) ${songB}`;
    }

    function selectSong(selected) {
      if (selected === 'A') {
        // Assume Song A wins for the first round
        answerLetters.push(correctAnswers[currentRound - 1]);
      } else {
        // Assume Song B wins for the first round
        answerLetters.push(correctAnswers[currentRound]);
      }

      currentRound++;

      if (currentRound <= 9) {
        showRound(currentRound);
      } else {
        // End game, show the final page
        document.getElementById('game').style.display = 'none';
        document.getElementById('endGame').style.display = 'block';
      }
    }

    function checkAnswer() {
      const enteredAnswer = document.getElementById('answer').value.toUpperCase();
      if (enteredAnswer === 'VALENTINE') {
        document.getElementById('endGame').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } else {
        alert('Oops, try again! Refresh the page to start over.');
      }
    }
  </script>
</body>
</html>
