<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Page</title>
  <link rel="stylesheet" href="style.css"> <!-- Link to the style.css file -->
</head>
<body>
  <!-- This section will be shown initially -->
  <div id="welcome">
    <h1>Welcome! Please enter the secret password:</h1>
    <input type="password" id="password" placeholder="Enter password">
    <button onclick="checkPassword()">Submit</button>
  </div>

  <!-- This section will be hidden initially -->
  <div id="content" class="hidden-content">
    <h2>🎉 Surprise! 🎉</h2>
    <p>Now that you've unlocked the secret, will you be my Valentine? ❤️</p>
  </div>

  <script>
    // On page load, hide the surprise message initially
    document.getElementById('content').style.display = 'none';

    function checkPassword() {
      const password = document.getElementById('password').value;
      const correctPassword = 'loveme123'; // This is the secret password
      if (password === correctPassword) {
        // Hide the welcome section and show the surprise message
        document.getElementById('welcome').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } else {
        alert('Oops, wrong password! Try again.');
      }
    }
  </script>
</body>
</html>
