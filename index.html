<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
      padding: 50px;
    }

    h1 {
      color: #333;
    }

    .hidden-content {
      display: none;
      font-size: 24px;
      color: #fff;
      background-color: #ff6699;
      padding: 20px;
      margin-top: 20px;
      font-weight: bold;
    }

    .button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #ff6699;
      color: white;
      border: none;
      cursor: pointer;
    }

    .button:hover {
      background-color: #ff3366;
    }

    .game-container {
      display: none;
      margin-top: 20px;
    }

    .round {
      display: flex;
      justify-content: space-between;
      margin: 20px 0;
      font-weight: bold;
    }

    .round .song {
      padding: 10px;
      font-size: 18px;
      background-color: #ffffff;
      color: #333;
      cursor: pointer;
      width: 45%;
      margin: 0 5%;
    }

    .round .song:hover {
      background-color: #ff3366;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Welcome to the Secret Game</h1>

  <div id="startButtonDiv">
    <button class="button" onclick="startGame()">Start Game</button>
  </div>

  <div class="game-container" id="gameContainer">
    <div class="round" id="round1">
      <div class="song" id="song1">Virginia Beach - Drake</div>
      <div class="song" id="song2">Codeine Crazy - Future</div>
    </div>
    <div class="round" id="round2">
      <div class="song" id="song3">APT. - ROSE</div>
      <div class="song" id="song4">California Gurls - Katy Perry</div>
    </div>
    <!-- Add more rounds as necessary -->
    <button class="button" onclick="nextRound()">Next Round</button>
  </div>

  <div id="content" class="hidden-content">
    <h2>🎉 Surprise! 🎉</h2>
    <p>Now that you've unlocked the secret, will you be my Valentine? ❤️</p>
  </div>

  <script>
    function startGame() {
      document.getElementById('startButtonDiv').style.display = 'none';
      document.getElementById('gameContainer').style.display = 'block';
    }

    function nextRound() {
      // Here you can add your logic for next rounds, for now, we'll just show the hidden content after the game.
      document.getElementById('content').style.display = 'block';
    }

    // Make sure each song gets clicked
    document.querySelectorAll('.song').forEach(function(song) {
      song.addEventListener('click', function() {
        alert(song.textContent + ' is the winner!');
      });
    });
  </script>
</body>
</html>
