<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Game</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
      padding: 50px;
    }

    #welcome, #game, #endGame, #content {
      display: none;
    }

    .hidden-content {
      display: none;
      font-size: 24px;
      color: #fff;
      background-color: #ff6699;
      padding: 20px;
      margin-top: 20px;
    }

    h1 {
      color: #333;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #ff6699;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #ff3366;
    }

    .game-container {
      display: flex;
      justify-content: space-between;
      width: 60%;
      margin: 20px auto;
    }

    .game-container button {
      width: 45%;
      padding: 15px;
      font-size: 16px;
      background-color: #ff6699;
      color: white;
      border: none;
      cursor: pointer;
    }

    .game-container button:hover {
      background-color: #ff3366;
    }

    #answer {
      font-size: 18px;
      padding: 10px;
      margin-top: 10px;
    }

    .final-text {
      font-size: 30px;
      font-weight: bold;
      color: #ff6699;
    }

    .song-name {
      font-weight: bold;
      font-size: 20px;
    }

  </style>
</head>
<body>
  <!-- Welcome Section -->
  <div id="welcome">
    <h1>Welcome to the Secret Game!</h1>
    <button id="startButton" onclick="startGame()">Start Game</button>
  </div>

  <!-- Game Section (Hidden Initially) -->
  <div id="game">
    <h2>Round <span id="roundNumber">1</span></h2>
    <div id="songQuestion"></div>
    <div class="game-container">
      <button onclick="selectSong('A')">Song A</button>
      <button onclick="selectSong('B')">Song B</button>
    </div>
  </div>

  <!-- End Game Section (Hidden Initially) -->
  <div id="endGame">
    <h2>Do you know what all the winning songs' first letters spell?</h2>
    <button onclick="checkAnswer()">Yes, I know!</button>
    <input type="text" id="answer" placeholder="Enter the word here">
  </div>

  <!-- Hidden Content After Correct Answer -->
  <div id="content" class="hidden-content">
    <h2 class="final-text">🎉 Surprise! 🎉</h2>
    <p class="final-text">Now that you've unlocked the secret, will you be my Valentine? ❤️</p>
  </div>

  <script>
    let currentRound = 1;
    let answerLetters = []; // To store the letters from correct answers
    let correctAnswers = ['V', 'A', 'L', 'E', 'N', 'T', 'I', 'N', 'E']; // Letters of the word "Valentine"

    // Round data: Song A, Song B, and the winner (A or B)
    let rounds = [
      { songA: "Virginia Beach - Drake", songB: "Codeine Crazy - Future", winner: 'A' },
      { songA: "APT. - ROSE", songB: "California Gurls - Katy Perry", winner: 'B' },
      { songA: "Luther - Kendrick Lamar", songB: "Static - Steve Lacy", winner: 'B' },
      { songA: "Espresso - Sabrina Carpenter", songB: "Vampire - Olivia Rodrigo", winner: 'A' },
      { songA: "Nights - Frank Ocean", songB: "Power Trip - J Cole", winner: 'A' },
      { songA: "The Worst - Jhene Aiko", songB: "How Many Drinks? - Miguel", winner: 'B' },
      { songA: "I Hate U - SZA", songB: "ALL MINE - Brent Faiyaz", winner: 'A' },
      { songA: "N 2 Deep - Drake", songB: "4x4 - Travis Scott", winner: 'B' },
      { songA: "Exchange - Bryson Tiller", songB: "No Chill - PARTYNEXTDOOR", winner: 'A' }
    ];

    function startGame() {
      // Hide the welcome message and show the game
      document.getElementById('welcome').style.display = 'none';
      document.getElementById('game').style.display = 'block';
      showRound(currentRound);
    }

    function showRound(round) {
      let songA = rounds[round - 1].songA;
      let songB = rounds[round - 1].songB;
      let winner = rounds[round - 1].winner;

      // Randomize the order of songs for each round (Left and Right)
      let randomOrder = Math.random() > 0.5 ? ['A', 'B'] : ['B', 'A'];
      let buttonA = randomOrder[0] === 'A' ? songA : songB;
      let buttonB = randomOrder[1] === 'B' ? songB : songA;

      // Display the song options
      document.getElementById('songQuestion').innerHTML = `Which song has more streams?<br><span class="song-name">${buttonA}</span> <br>OR <br><span class="song-name">${buttonB}</span>`;
    }

    function selectSong(selected) {
      // Store the selected answer for the current round
      let winner = rounds[currentRound - 1].winner;
      if (selected === winner) {
        answerLetters.push(correctAnswers[currentRound - 1]);
      }

      currentRound++;

      if (currentRound <= 9) {
        showRound(currentRound);
        document.getElementById('roundNumber').innerText = currentRound;
      } else {
        // End game, show the final page
        document.getElementById('game').style.display = 'none';
        document.getElementById('endGame').style.display = 'block';
      }
    }

    function checkAnswer() {
      const enteredAnswer = document.getElementById('answer').value.toUpperCase();
      if (enteredAnswer === 'VALENTINE') {
        document.getElementById('endGame').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } else {
        alert('Oops, try again! Refresh the page to start over.');
      }
    }
  </script>
</body>
</html>
